# AnalysisTemplate "success-rate"
# -------------------------------
# Type de provider : Job. Le contrôleur Argo Rollouts crée un Job Kubernetes
# qui sonde le service CANARY un certain nombre de fois et calcule le taux de
# requêtes HTTP 200. Si le taux est sous le seuil, le Job sort en erreur (exit 1)
# -> la métrique est en échec -> le Rollout est automatiquement annulé (rollback).
#
# Pourquoi un Job et pas Prometheus ici ?
#   L'app de démo n'expose pas d'endpoint /metrics. Le provider Job permet une
#   analyse 100% autonome, sans dépendance externe. Une variante Prometheus
#   (réaliste en production) est fournie dans monitoring/analysistemplate-prometheus.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: demo
spec:
  args:
    - name: canary-service
    - name: success-threshold   # ex: "95" = 95% de requêtes en 200 requises
      value: "95"
  metrics:
    - name: http-success-rate
      # une seule mesure, échec immédiat si elle rate
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 120
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: probe
                    image: busybox:1.36
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        SVC="{{args.canary-service}}"
                        THRESHOLD="{{args.success-threshold}}"
                        TOTAL=30
                        OK=0
                        echo "Sonde du canary http://$SVC/color ($TOTAL requetes, seuil ${THRESHOLD}%)"
                        i=0
                        while [ $i -lt $TOTAL ]; do
                          if wget -q -T 2 -O /dev/null "http://$SVC/color"; then
                            OK=$((OK+1))
                          fi
                          i=$((i+1))
                          sleep 0.3
                        done
                        RATE=$((OK * 100 / TOTAL))
                        echo "Resultat : $OK/$TOTAL requetes en succes -> ${RATE}% (seuil ${THRESHOLD}%)"
                        if [ "$RATE" -ge "$THRESHOLD" ]; then
                          echo "ANALYSE OK : canary sain, promotion autorisee."
                          exit 0
                        else
                          echo "ANALYSE KO : taux d'erreur trop eleve, rollback declenche."
                          exit 1
                        fi
